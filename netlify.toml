# HealthMetrics Assistance site - static deploy, no build step.
#
# The site/ directory holds the full static site (migrated from the
# Claude artifact export on 2026-10-20). Analytics and SEO tags are baked
# into the pages themselves:
#   Clarity  xtd9vn6v4x       - pinned inline in every page head
#   GA4/GTM  not enabled      - gtag/dataLayer stub present; add the GA4
#                               loader to the page heads when a property
#                               is ready (see MIGRATION-TAGS.md)
#   SITE_URL                  - baked into canonical/OG tags, robots.txt
#                               and sitemap.xml by scripts at migration
#                               time; no longer read at build time.
#
# The old Astro provider-directory app remains in src/ for reference and
# for the full 8,127-row providers.csv master.

[build]
  command = ""
  publish = "site"
